[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scouter"
version = "0.1.0"
description = "Dockerized vLLM inference server with assistant-axis activation monitoring, steering, and axis-vector generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scouter" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.24",
    "torch>=2.0",
    "huggingface_hub>=0.23",
    "sse-starlette>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# vLLM serving backend (GPU).
vllm = ["vllm>=0.6"]
# Axis-vector generation: extract activations from an HF model and compute the axis.
generate = ["transformers>=4.40", "accelerate>=0.30"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
scouter = "scouter.server:main"
scouter-generate = "scouter.axis.generate:main"
scouter-emotions = "scouter.emotions:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scouter = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
# Heavy/optional backends ship no (or partial) stubs; don't fail on them.
[[tool.mypy.overrides]]
module = ["vllm", "vllm.*", "vllm_hook_plugins", "vllm_hook_plugins.*", "torch", "torch.*", "transformers", "transformers.*", "llama_cpp", "llama_cpp.*", "gguf", "huggingface_hub"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
